plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    // Optional name for the greeting ("Good evening, Alex"): tvhome.userName=Alex in launcher/local.properties.
    def localProps = new Properties()
    def localFile = rootProject.file('local.properties')
    if (localFile.exists()) localFile.withInputStream { localProps.load(it) }

    defaultConfig {
        resValue 'string', 'user_name', localProps.getProperty('tvhome.userName', '')
        // Override with -PlauncherApplicationId=... (the id on the TV differs from the Java package below).
        applicationId project.findProperty('launcherApplicationId') ?: 'com.andrewsaad.myhome'
        minSdk 26
        targetSdk 29
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // Sideloaded over adb, never published: the Play Store target-SDK floor does not apply.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    testImplementation 'junit:junit:4.13.2'
}
